name: Build and Release

on:
  push:
    branches: [main, master, feature/v0.3.0-crud]
    tags: ['v*']
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: web
        run: npm install

      - name: TypeScript and Vite build
        working-directory: web
        run: npm run build

      - name: Package FiveM resource
        run: |
          mkdir -p release
          zip -r release/lv_dev.zip . \
            -x '.git/*' 'web/node_modules/*' 'web/src/*' 'web/package-lock.json'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lv_dev-resource
          path: release/lv_dev-${GITHUB_REF_NAME}.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/lv_dev-${GITHUB_REF_NAME}.zip
